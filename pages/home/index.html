<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!--=============== FAVICON ===============-->
		<link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon/favicon-16x16.png" />
		<link rel="manifest" href="../../assets/favicon/site.webmanifest" />

		<!--=============== CSS ===============-->
		<link rel="stylesheet" href="style.css" />

		<title>Coffee House</title>
	</head>
	<body>
		<div class="wrapper">
			<!--==================== HEADER ====================-->
			<header class="header">
				<div class="header__container _container">
					<div class="header__logo">
						<a class="logo" href="index.html">
							<svg class="logo__icon">
								<use xlink:href="../../assets/svg/sprite.svg#logo"></use>
							</svg>
						</a>
					</div>
					<div class="header__menu">
						<nav class="menu">
							<ul class="menu__list">
								<li class="menu__item">
									<a href="#favorite-coffee" class="menu__link link">Favorite coffee</a>
								</li>
								<li class="menu__item">
									<a href="#about" class="menu__link link">About</a>
								</li>
								<li class="menu__item">
									<a href="#mobile-app" class="menu__link link">Mobile app</a>
								</li>
								<li class="menu__item">
									<a href="#contacts" class="menu__link link">Contact us</a>
								</li>
							</ul>
						</nav>
						<div class="header__coffee-menu image-link">
							<a class="image-link__link link" href="../menu/index.html">
								Menu
								<svg class="coffee__icon">
									<use xlink:href="../../assets/svg/sprite.svg#coffee-cup"></use>
								</svg>
							</a>
						</div>
					</div>
					<div class="menu__icon">
						<span></span>
					</div>
				</div>
			</header>

			<!--==================== MAIN ====================-->
			<main class="main"></main>

			<!--==================== FOOTER ====================-->
			<footer class="footer" id="contacts"></footer>
		</div>

		<!--==================== SCRIPT JS ====================-->
		<script src="script.js" defer></script>
	</body>
</html>
